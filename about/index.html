<title>GURT Enterprises | Global Unified Robotics Technology</title>
<meta name="description" content="GURT Enterprises - Global Unified Robotics Technology.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&family=Spectral:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;0,800;1,200;1,300;1,400;1,500;1,600;1,700;1,800&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111111;
            color: white;
        }

        header {
            padding: 25px 50px;
            border-bottom: 1px solid #333333;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            letter-spacing: 4px;
        }

        /* HERO SECTION */
        .hero {
            min-height: 70vh;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            overflow: hidden;
        }

        /* GURT text sits above the animation */
        .hero-content {
            position: relative;
            z-index: 2;
        
            width: 455px;
            max-width: 90vw;
        }
        
        .hero h1 {
            font-family: Arial, sans-serif;
            font-size: 120px;
            margin: 0px 5px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            width: 100%;
        }
        
        .hero h1 span {
            text-align: center;
        }
        
        .hero p {
            font-family: "Spectral", serif;
            font-weight: 500;
            font-size: 18px;
            font-style: normal;
            color: #FFFFFF;
            margin: -10px 5px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            width: 100%;
        }
        
        .hero p span {
            text-align: center;
        }
        /* ASCII ANIMATION */
        #ascii-animation {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1;
            background: transparent;
            pointer-events: none;
        }


        /* GENERAL SECTIONS */
        section {
            padding: 80px 15%;
            border-top: 1px solid #333333;
        }

        section h2 {
            font-family: "Spectral", serif;
            font-weight: 500;
            font-size: 32px;
        }

        section p {
            font-family: "Spectral", serif;
            font-weight: 500;
            color: #bbbbbb;
            line-height: 1.6;
            max-width: 700px;
        }

        footer {
            text-align: center;
            padding: 30px;
            color: #777777;
            border-top: 1px solid #333333;
        }

    </style>
</head>

        <div class="logo">
            GURT
        </div>
    </header>
